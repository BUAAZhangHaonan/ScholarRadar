<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>ScholarRadar · 研究工作台</title>
    <link rel="stylesheet" href="/static/site.css" />
  </head>
  <body>
    <header class="mast">
      <div class="mast-inner">
        <a class="brand" href="/"
          ><i class="mark" aria-hidden="true"></i>ScholarRadar</a
        >
        <nav aria-label="研究工作台">
          <a href="/">今日变化</a><a href="/directions">方向库</a
          ><a href="/library">证据库</a><a href="/actions">行动与反馈</a
          ><a href="/settings">设置与运行</a>
        </nav>
      </div>
    </header>
    <main id="app" class="shell" aria-live="polite"></main>
    <dialog id="detail">
      <header>
        <strong id="detail-title">原文证据</strong
        ><button id="close" class="quiet">关闭</button>
      </header>
      <section id="detail-body"></section>
    </dialog>
    <dialog id="evidence-drawer" aria-labelledby="evidence-title">
      <header><strong id="evidence-title">原文</strong><button type="button" id="evidence-close" class="quiet">返回阅读</button></header>
      <section id="evidence-body" class="drawer-body"></section>
    </dialog>
    <p id="toast" role="status" hidden></p>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
